<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<style>
  :root {
    --paper: #F7F5EF;
    --card: #FFFFFF;
    --ink: #20241F;
    --muted: #6E6A5E;
    --line: #DEDACD;
    --accent: #2F6F5E;
    --accent-soft: #E4EEEA;
    --gold: #B8842E;
    --gold-soft: #F3E8D3;
    --rose: #B4555A;
    --rose-soft: #F5E3E2;
    --radius: 6px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }

  a { color: inherit; }

  /* ---------- Shell ---------- */
  .shell {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 10px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.2px;
  }

  .tabs {
    display: flex;
    gap: 2px;
    background: var(--line);
    border-radius: var(--radius);
    padding: 2px;
  }

  .tab-btn {
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--muted);
  }

  .tab-btn.active {
    background: var(--card);
    color: var(--ink);
  }

  /* ---------- Auth bar ---------- */
  .auth-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  .google-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--line);
    background: var(--card);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--ink);
  }
  .google-btn:hover { background: var(--paper); }
  .google-btn svg { width: 16px; height: 16px; }

  .user-chip {
    display: none;
    align-items: center;
    gap: 8px;
  }
  .user-avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--line);
  }
  .user-chip span {
    font-size: 13px;
    font-weight: 600;
  }
  .signout-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
    margin-inline-start: 4px;
  }
  .signout-btn:hover { color: var(--rose); }

  .auth-status {
    font-size: 11.5px;
    color: var(--muted);
  }

  .view { display: none; }
  .view.active { display: block; }

  /* ---------- Build view layout ---------- */
  .build-grid {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 28px;
    align-items: start;
  }

  @media (max-width: 820px) {
    .build-grid { grid-template-columns: 1fr; }
    .summary-panel { position: static !important; order: -1; }
  }

  /* ---------- Sections / accordion ---------- */
  .food-section {
    border-top: 1px solid var(--line);
  }
  .food-section:last-child { border-bottom: 1px solid var(--line); }

  .food-section summary {
    list-style: none;
    cursor: pointer;
    padding: 14px 2px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 600;
    font-size: 15px;
  }
  .food-section summary::-webkit-details-marker { display: none; }

  .section-meta {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }

  .chevron {
    display: inline-block;
    transition: transform 0.15s ease;
    color: var(--muted);
    margin-inline-start: 8px;
  }
  .food-section[open] .chevron { transform: rotate(90deg); }

  .ingredient-list {
    padding: 0 2px 16px;
  }

  .ingredient-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px dashed var(--line);
  }
  .ingredient-row:last-child { border-bottom: none; }

  .ingredient-row input[type="checkbox"] {
    margin-top: 3px;
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }

  .ingredient-row.disabled { opacity: 0.35; }
  .ingredient-row.disabled input { cursor: not-allowed; }

  .ingredient-info { flex: 1; min-width: 0; }

  .ingredient-name {
    font-size: 14px;
    font-weight: 600;
  }

  .ingredient-base {
    font-size: 12px;
    color: var(--muted);
    margin-top: 1px;
  }

  .qty-row {
    display: none;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .qty-row.show { display: flex; }

  .qty-btn {
    border: 1px solid var(--line);
    background: var(--card);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    padding: 4px 9px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--muted);
  }
  .qty-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .row-stats {
    font-size: 12px;
    color: var(--ink);
    text-align: right;
    white-space: nowrap;
    padding-top: 3px;
    min-width: 78px;
  }
  .row-stats .cal { font-weight: 600; }
  .row-stats .prot { color: var(--muted); font-size: 11px; display: block; }

  .limit-note {
    font-size: 11.5px;
    color: var(--rose);
    margin-top: 4px;
    display: none;
  }
  .limit-note.show { display: block; }

  /* ---------- Custom ingredient delete ---------- */
  .custom-del {
    display: inline-block;
    color: var(--rose);
    cursor: pointer;
    font-weight: 600;
    padding: 0 3px;
    font-size: 14px;
  }
  .custom-del:hover { color: #8f3d41; }

  /* ---------- Add ingredient / add section controls ---------- */
  .add-ing-wrap, .add-section-wrap {
    padding: 10px 2px 4px;
  }
  .add-ing-toggle, .add-section-toggle {
    border: 1px dashed var(--line);
    background: transparent;
    color: var(--accent);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 4px;
    cursor: pointer;
  }
  .add-section-toggle { color: var(--gold); margin: 6px 0 4px; }

  .add-ing-form, .add-section-form {
    display: none;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
    padding: 12px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .add-ing-form.show, .add-section-form.show { display: flex; }

  .add-ing-input {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
    background: var(--card);
    width: 100%;
  }
  .add-ing-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .add-ing-row2 {
    display: flex;
    gap: 8px;
  }
  .add-ing-row2 .add-ing-input { flex: 1; }

  .add-ing-actions {
    display: flex;
    gap: 8px;
  }
  .add-ing-save, .add-section-save {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .add-ing-cancel, .add-section-cancel {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }
  .add-ing-error {
    font-size: 11.5px;
    color: var(--rose);
    min-height: 14px;
  }

  /* ---------- Vegetables toggle ---------- */
  .veg-toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 2px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-top: 4px;
  }
  .veg-left { display: flex; align-items: center; gap: 12px; }
  .veg-left input { width: 16px; height: 16px; accent-color: var(--accent); }
  .veg-title { font-weight: 600; font-size: 15px; }
  .veg-sub { font-size: 12px; color: var(--muted); }

  /* ---------- Summary panel ---------- */
  .summary-panel {
    position: sticky;
    top: 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
  }

  .summary-panel h2 {
    font-size: 13px;
    text-transform: none;
    margin: 0 0 14px;
    font-weight: 600;
    color: var(--muted);
  }

  .title-input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 9px 10px;
    font-family: inherit;
    font-size: 14px;
    margin-bottom: 16px;
    background: var(--paper);
  }
  .title-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .stat-block {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat {
    flex: 1;
    background: var(--accent-soft);
    border-radius: 4px;
    padding: 12px;
    text-align: center;
  }
  .stat.protein { background: var(--gold-soft); }
  .stat .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 600;
    color: var(--accent);
  }
  .stat.protein .num { color: var(--gold); }
  .stat .lbl {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .picked-list {
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 16px;
    max-height: 180px;
    overflow-y: auto;
  }
  .picked-list .empty { font-style: italic; }
  .picked-item {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px dashed var(--line);
  }
  .picked-item:last-child { border-bottom: none; }

  .save-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 11px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    border-radius: 4px;
    cursor: pointer;
  }
  .save-btn:hover { background: #275c4e; }
  .save-btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

  .reset-btn {
    width: 100%;
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 8px;
    font-family: inherit;
    font-size: 12.5px;
    cursor: pointer;
    margin-top: 6px;
  }
  .reset-btn:hover { color: var(--rose); }

  /* ---------- Saved recipes view ---------- */
  .search-wrap { margin-bottom: 18px; }
  .search-input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    background: var(--card);
  }
  .search-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .recipe-list { display: flex; flex-direction: column; gap: 10px; }

  .recipe-card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    padding: 14px 16px;
    cursor: pointer;
  }
  .recipe-card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }
  .recipe-title { font-weight: 700; font-size: 15px; }
  .recipe-stats { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .recipe-stats .mono { color: var(--accent); font-weight: 600; }
  .recipe-ingredients {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 6px;
    line-height: 1.5;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .big { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }

  /* ---------- Detail modal ---------- */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(32,36,31,0.45);
    z-index: 10;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
  }
  .overlay.show { display: flex; }

  .modal {
    background: var(--card);
    border-radius: var(--radius);
    max-width: 480px;
    width: 100%;
    padding: 22px;
  }
  .modal-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
  }
  .modal-title { font-size: 18px; font-weight: 700; }
  .close-btn {
    border: none;
    background: transparent;
    font-size: 20px;
    color: var(--muted);
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
  }
  .modal-stat-block { display: flex; gap: 10px; margin: 14px 0; }
  .modal-ing-list { font-size: 13.5px; margin-top: 12px; }
  .modal-ing-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px dashed var(--line);
  }
  .modal-ing-row:last-child { border-bottom: none; }
  .modal-delete {
    margin-top: 18px;
    width: 100%;
    background: var(--rose-soft);
    color: var(--rose);
    border: none;
    padding: 10px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <h1>Recipe Builder</h1>
    <div class="tabs">
      <button class="tab-btn active" data-tab="build">Build</button>
      <button class="tab-btn" data-tab="saved">Saved Recipes</button>
    </div>
  </header>

  <div class="auth-bar">
    <button class="google-btn" id="googleSignInBtn">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-2 14-5.6l-6.5-5.3c-2 1.5-4.6 2.4-7.5 2.4-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.5 5.3C41.5 35.8 44 30.3 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Sign in with Google
    </button>
    <div class="user-chip" id="userChip">
      <img class="user-avatar" id="userAvatar" alt="">
      <span id="userName"></span>
      <button class="signout-btn" id="signOutBtn">Sign out</button>
    </div>
    <span class="auth-status" id="authStatus">Sign in to sync recipes across devices — otherwise they're saved only on this device.</span>
  </div>

  <!-- ============ BUILD VIEW ============ -->
  <div class="view active" id="view-build">
    <div class="build-grid">
      <div id="sections-host"></div>

      <div class="summary-panel">
        <h2>Recipe Summary</h2>
        <input class="title-input" id="recipeTitle" type="text" placeholder="Recipe title">
        <div class="stat-block">
          <div class="stat">
            <div class="num mono" id="statCalories">0</div>
            <div class="lbl">calories</div>
          </div>
          <div class="stat protein">
            <div class="num mono" id="statProtein">0g</div>
            <div class="lbl">protein</div>
          </div>
        </div>
        <div class="picked-list" id="pickedList">
          <div class="empty">No ingredients selected yet.</div>
        </div>
        <button class="save-btn" id="saveBtn" disabled>Save Recipe</button>
        <button class="reset-btn" id="resetBtn">Clear selection</button>
      </div>
    </div>
  </div>

  <!-- ============ SAVED VIEW ============ -->
  <div class="view" id="view-saved">
    <div class="search-wrap">
      <input class="search-input" id="searchInput" type="text" placeholder="Search recipes by title or ingredient...">
    </div>
    <div class="recipe-list" id="recipeList"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-top">
      <div class="modal-title" id="modalTitle"></div>
      <button class="close-btn" id="closeModal">&times;</button>
    </div>
    <div class="stat-block modal-stat-block">
      <div class="stat">
        <div class="num mono" id="modalCalories">0</div>
        <div class="lbl">calories</div>
      </div>
      <div class="stat protein">
        <div class="num mono" id="modalProtein">0g</div>
        <div class="lbl">protein</div>
      </div>
    </div>
    <div class="modal-ing-list" id="modalIngList"></div>
    <button class="modal-delete" id="modalDelete">Delete Recipe</button>
  </div>
</div>

<script>

  "Legumes (Protein + Carb)": [

const VEGETABLE = { name: "Vegetables (half plate)", cal: 50 };
const MAX_PER_SECTION = 10;
const QTY_OPTIONS = [1, 0.75, 0.5, 0.25];
const QTY_LABELS = { 1: "Full", 0.75: "¾", 0.5: "½", 0.25: "¼" };

// ================= STATE =================
// selections: { "SectionName|ItemName": { qty: 1 } }
let selections = {};
let vegSelected = false;

// ================= CUSTOM INGREDIENTS / SECTIONS =================
// Stored separately from built-in DATA so we never mutate the shipped defaults.
// Shape: { "Section Name": [ {name, amt, cal:[min,max], prot:[min,max]|null}, ... ] }
function loadCustomData() {
  try {
    return JSON.parse(localStorage.getItem("customFoodData") || "{}");
  } catch (e) { return {}; }
}
function saveCustomData(obj) {
  localStorage.setItem("customFoodData", JSON.stringify(obj));
}

let customData = loadCustomData();

// Merge built-in DATA with custom additions into one working object.
// Built-in sections get custom items appended; custom-only sections appear after.
function getAllSections() {
  const merged = {};
  Object.keys(DATA).forEach(s => {
    merged[s] = DATA[s].concat(customData[s] || []);
  });
  Object.keys(customData).forEach(s => {
    if (!merged[s]) merged[s] = customData[s].slice();
  });
  return merged;
}

function isCustomItem(section, itemName) {
  const custom = customData[section] || [];
  return custom.some(i => i.name === itemName);
}

function addCustomIngredient(section, item) {
  if (!customData[section]) customData[section] = [];
  customData[section].push(item);
  saveCustomData(customData);
}

function removeCustomIngredient(section, itemName) {
  if (!customData[section]) return;
  customData[section] = customData[section].filter(i => i.name !== itemName);
  if (customData[section].length === 0) delete customData[section];
  saveCustomData(customData);
}

function addCustomSection(name) {
  if (!customData[name]) customData[name] = [];
  saveCustomData(customData);
}

// ================= STORAGE =================
// Guest mode: localStorage. Signed in: Firestore, scoped to the user's uid.
function loadLocalRecipes() {
  try {
    return JSON.parse(localStorage.getItem("recipes") || "[]");
  } catch (e) { return []; }
}
function saveLocalRecipes(list) {
  localStorage.setItem("recipes", JSON.stringify(list));
}

async function fetchRecipes() {
  if (currentUser) {
    const snap = await db.collection("recipes").where("uid", "==", currentUser.uid).get();
    const list = snap.docs.map(d => d.data());
    list.sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
    return list;
  }
  return loadLocalRecipes();
}

async function persistRecipe(recipe) {
  if (currentUser) {
    await db.collection("recipes").doc(recipe.id).set({ ...recipe, uid: currentUser.uid });
    return;
  }
  const list = loadLocalRecipes();
  list.unshift(recipe);
  saveLocalRecipes(list);
}

async function deleteRecipeById(id) {
  if (currentUser) {
    await db.collection("recipes").doc(id).delete();
    return;
  }
  let list = loadLocalRecipes();
  list = list.filter(r => r.id !== id);
  saveLocalRecipes(list);
}

// ================= HELPERS =================
function avg(pair) { return (pair[0] + pair[1]) / 2; }
function fmtNum(n) {
  return Math.round(n * 10) / 10 === Math.round(n) ? Math.round(n) : (Math.round(n * 10) / 10);
}
function keyFor(section, itemName) { return section + "|" + itemName; }

// ================= BUILD SECTION UI =================
const host = document.getElementById("sections-host");

function renderSections() {
  host.innerHTML = "";
  const allSections = getAllSections();

  Object.keys(allSections).forEach(section => {
    const items = allSections[section];
    const details = document.createElement("details");
    details.className = "food-section";
    details.open = false;

    const summary = document.createElement("summary");
    summary.innerHTML = `<span>${section}</span><span class="section-meta">Optional · up to ${MAX_PER_SECTION}<span class="chevron">›</span></span>`;
    details.appendChild(summary);

    const list = document.createElement("div");
    list.className = "ingredient-list";

    items.forEach(item => {
      const row = buildIngredientRow(section, item);
      list.appendChild(row);
    });

    list.appendChild(buildAddIngredientControl(section));

    details.appendChild(list);
    host.appendChild(details);
  });

  host.appendChild(buildAddSectionControl());

  // vegetables toggle, appended after sections
  const vegRow = document.createElement("div");
  vegRow.className = "veg-toggle-row";
  vegRow.innerHTML = `
    <div class="veg-left">
      <input type="checkbox" id="vegCheckbox">
      <div>
        <div class="veg-title">Vegetables</div>
        <div class="veg-sub">Half a plate ≈ 50 calories</div>
      </div>
    </div>
    <div class="row-stats"><span class="cal mono">50</span> cal</div>
  `;
  host.appendChild(vegRow);
  vegRow.querySelector("#vegCheckbox").addEventListener("change", (e) => {
    vegSelected = e.target.checked;
    updateSummary();
  });

  restoreSelectionUI();
}

function restoreSelectionUI() {
  // Re-apply checkbox / quantity state after a re-render (e.g. after adding an ingredient).
  Object.entries(selections).forEach(([key, sel]) => {
    const row = findRowByKey(sel.section, sel.item.name);
    if (!row) return;
    const cb = row.querySelector("input[type=checkbox]");
    cb.checked = true;
    const qtyRow = row.querySelector(".qty-row");
    qtyRow.classList.add("show");
    qtyRow.querySelectorAll(".qty-btn").forEach(b => b.classList.toggle("active", parseFloat(b.dataset.qty) === sel.qty));
    updateRowStats(row, sel.item, sel.qty);
    refreshDisabledStates(sel.section);
  });
  if (vegSelected) {
    const vegCb = document.getElementById("vegCheckbox");
    if (vegCb) vegCb.checked = true;
  }
}

function findRowByKey(section, itemName) {
  const details = [...document.querySelectorAll(".food-section")].find(d => d.querySelector("summary span").textContent === section);
  if (!details) return null;
  return [...details.querySelectorAll(".ingredient-row")].find(r => r.dataset.itemName === itemName) || null;
}

function cssId(str) { return str.replace(/[^a-z0-9]/gi, "-"); }

function buildIngredientRow(section, item) {
  const row = document.createElement("div");
  row.className = "ingredient-row";
  row.dataset.section = section;
  row.dataset.itemName = item.name;

  const cb = document.createElement("input");
  cb.type = "checkbox";

  const info = document.createElement("div");
  info.className = "ingredient-info";
  const isCustom = isCustomItem(section, item.name);
  info.innerHTML = `
    <div class="ingredient-name">${item.name}${isCustom ? ' <span class="custom-del" title="Remove custom ingredient" data-section="' + section + '" data-item="' + item.name.replace(/"/g,'&quot;') + '">×</span>' : ''}</div>
    <div class="ingredient-base">Base: ${item.amt} · <span class="mono">${calLabel(item.cal)}</span> cal${item.prot ? " · <span class=\"mono\">" + protLabel(item.prot) + "</span> protein" : ""}</div>
    <div class="qty-row" id="qty-${cssId(section)}-${cssId(item.name)}"></div>
    <div class="limit-note">Up to ${MAX_PER_SECTION} items per section — deselect another item first.</div>
  `;

  const stats = document.createElement("div");
  stats.className = "row-stats";
  stats.innerHTML = `<span class="cal mono">—</span>`;

  row.appendChild(cb);
  row.appendChild(info);
  row.appendChild(stats);

  const qtyRow = info.querySelector(".qty-row");
  QTY_OPTIONS.forEach(q => {
    const btn = document.createElement("button");
    btn.className = "qty-btn" + (q === 1 ? " active" : "");
    btn.type = "button";
    btn.textContent = QTY_LABELS[q];
    btn.dataset.qty = q;
    btn.addEventListener("click", () => {
      const k = keyFor(section, item.name);
      if (!selections[k]) return;
      selections[k].qty = q;
      qtyRow.querySelectorAll(".qty-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      updateRowStats(row, item, q);
      updateSummary();
    });
    qtyRow.appendChild(btn);
  });

  cb.addEventListener("change", () => {
    const k = keyFor(section, item.name);
    if (cb.checked) {
      const currentCount = Object.keys(selections).filter(kk => kk.startsWith(section + "|")).length;
      if (currentCount >= MAX_PER_SECTION) {
        cb.checked = false;
        info.querySelector(".limit-note").classList.add("show");
        setTimeout(() => info.querySelector(".limit-note").classList.remove("show"), 2200);
        return;
      }
      selections[k] = { section, item, qty: 1 };
      qtyRow.classList.add("show");
      qtyRow.querySelectorAll(".qty-btn").forEach(b => b.classList.toggle("active", parseFloat(b.dataset.qty) === 1));
      updateRowStats(row, item, 1);
    } else {
      delete selections[k];
      qtyRow.classList.remove("show");
      stats.querySelector(".cal").textContent = "—";
      const p = stats.querySelector(".prot");
      if (p) p.remove();
    }
    refreshDisabledStates(section);
    updateSummary();
  });

  return row;
}

// ---- Inline "add ingredient" form, shown at the bottom of each section ----
function buildAddIngredientControl(section) {
  const wrap = document.createElement("div");
  wrap.className = "add-ing-wrap";

  const toggleBtn = document.createElement("button");
  toggleBtn.type = "button";
  toggleBtn.className = "add-ing-toggle";
  toggleBtn.textContent = "+ Add ingredient";

  const form = document.createElement("div");
  form.className = "add-ing-form";
  form.innerHTML = `
    <input type="text" class="add-ing-input" placeholder="Name" data-field="name">
    <input type="text" class="add-ing-input" placeholder="Amount label (e.g. 1 tbsp, 100 g)" data-field="amt">
    <div class="add-ing-row2">
      <input type="text" class="add-ing-input" placeholder="Calories (e.g. 120 or 100-150)" data-field="cal">
      <input type="text" class="add-ing-input" placeholder="Protein g (optional)" data-field="prot">
    </div>
    <div class="add-ing-actions">
      <button type="button" class="add-ing-save">Add</button>
      <button type="button" class="add-ing-cancel">Cancel</button>
    </div>
    <div class="add-ing-error"></div>
  `;

  toggleBtn.addEventListener("click", () => {
    form.classList.toggle("show");
  });

  form.querySelector(".add-ing-cancel").addEventListener("click", () => {
    form.classList.remove("show");
    form.querySelectorAll(".add-ing-input").forEach(i => i.value = "");
    form.querySelector(".add-ing-error").textContent = "";
  });

  form.querySelector(".add-ing-save").addEventListener("click", () => {
    const name = form.querySelector('[data-field="name"]').value.trim();
    const amt = form.querySelector('[data-field="amt"]').value.trim();
    const calRaw = form.querySelector('[data-field="cal"]').value.trim();
    const protRaw = form.querySelector('[data-field="prot"]').value.trim();
    const errEl = form.querySelector(".add-ing-error");

    if (!name || !amt || !calRaw) {
      errEl.textContent = "Name, amount, and calories are required.";
      return;
    }
    const cal = parseRange(calRaw);
    if (!cal) {
      errEl.textContent = "Calories should look like 120 or 100-150.";
      return;
    }
    const prot = protRaw ? parseRange(protRaw) : null;
    if (protRaw && !prot) {
      errEl.textContent = "Protein should look like 10 or 8-12.";
      return;
    }

    addCustomIngredient(section, { name, amt, cal, prot });
    form.querySelectorAll(".add-ing-input").forEach(i => i.value = "");
    errEl.textContent = "";
    form.classList.remove("show");
    renderSections();
  });

  wrap.appendChild(toggleBtn);
  wrap.appendChild(form);
  return wrap;
}

function parseRange(str) {
  const cleaned = str.replace(/[^\d.\-–]/g, "");
  const parts = cleaned.split(/[-–]/).filter(Boolean).map(Number);
  if (parts.length === 1 && !isNaN(parts[0])) return [parts[0], parts[0]];
  if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) return [parts[0], parts[1]];
  return null;
}

// ---- Control to add a brand-new section ----
function buildAddSectionControl() {
  const wrap = document.createElement("div");
  wrap.className = "add-section-wrap";

  const toggleBtn = document.createElement("button");
  toggleBtn.type = "button";
  toggleBtn.className = "add-section-toggle";
  toggleBtn.textContent = "+ New section";

  const form = document.createElement("div");
  form.className = "add-section-form";
  form.innerHTML = `
    <input type="text" class="add-ing-input" placeholder="Section name" data-field="sectionName">
    <div class="add-ing-actions">
      <button type="button" class="add-section-save">Create</button>
      <button type="button" class="add-section-cancel">Cancel</button>
    </div>
    <div class="add-ing-error"></div>
  `;

  toggleBtn.addEventListener("click", () => form.classList.toggle("show"));
  form.querySelector(".add-section-cancel").addEventListener("click", () => {
    form.classList.remove("show");
    form.querySelector('[data-field="sectionName"]').value = "";
  });
  form.querySelector(".add-section-save").addEventListener("click", () => {
    const nameInput = form.querySelector('[data-field="sectionName"]');
    const name = nameInput.value.trim();
    const errEl = form.querySelector(".add-ing-error");
    if (!name) { errEl.textContent = "Enter a section name."; return; }
    const all = getAllSections();
    if (all[name]) { errEl.textContent = "A section with that name already exists."; return; }
    addCustomSection(name);
    nameInput.value = "";
    renderSections();
  });

  wrap.appendChild(toggleBtn);
  wrap.appendChild(form);
  return wrap;
}

function calLabel(pair) {
  return pair[0] === pair[1] ? fmtNum(pair[0]) : fmtNum(pair[0]) + "–" + fmtNum(pair[1]);
}
function protLabel(pair) {
  return (pair[0] === pair[1] ? fmtNum(pair[0]) : fmtNum(pair[0]) + "–" + fmtNum(pair[1])) + "g";
}

function updateRowStats(row, item, qty) {
  const stats = row.querySelector(".row-stats");
  const cal = avg(item.cal) * qty;
  let html = `<span class="cal mono">${fmtNum(cal)}</span> cal`;
  if (item.prot) {
    const prot = avg(item.prot) * qty;
    html += `<span class="prot mono">${fmtNum(prot)}g protein</span>`;
  }
  stats.innerHTML = html;
}

function refreshDisabledStates(section) {
  const count = Object.keys(selections).filter(k => k.startsWith(section + "|")).length;
  const details = [...document.querySelectorAll(".food-section")].find(d => d.querySelector("summary span").textContent === section);
  if (!details) return;
  const rows = details.querySelectorAll(".ingredient-row");
  rows.forEach(row => {
    const cb = row.querySelector("input[type=checkbox]");
    if (!cb.checked) {
      row.classList.toggle("disabled", count >= MAX_PER_SECTION);
      cb.disabled = count >= MAX_PER_SECTION;
    }
  });
}

// ================= SUMMARY =================
function updateSummary() {
  let totalCal = vegSelected ? VEGETABLE.cal : 0;
  let totalProt = 0;
  const picked = [];

  if (vegSelected) picked.push({ name: VEGETABLE.name, cal: VEGETABLE.cal, prot: 0 });

  Object.values(selections).forEach(sel => {
    const cal = avg(sel.item.cal) * sel.qty;
    const prot = sel.item.prot ? avg(sel.item.prot) * sel.qty : 0;
    totalCal += cal;
    totalProt += prot;
    picked.push({ name: sel.item.name + (sel.qty !== 1 ? " (" + QTY_LABELS[sel.qty] + ")" : ""), cal, prot });
  });

  document.getElementById("statCalories").textContent = fmtNum(totalCal);
  document.getElementById("statProtein").textContent = fmtNum(totalProt) + "g";

  const listEl = document.getElementById("pickedList");
  if (picked.length === 0) {
    listEl.innerHTML = '<div class="empty">No ingredients selected yet.</div>';
  } else {
    listEl.innerHTML = picked.map(p =>
      `<div class="picked-item"><span>${p.name}</span><span class="mono">${fmtNum(p.cal)} cal</span></div>`
    ).join("");
  }

  document.getElementById("saveBtn").disabled = picked.length === 0;
}

// ================= SAVE / RESET =================
document.getElementById("saveBtn").addEventListener("click", async () => {
  const titleInput = document.getElementById("recipeTitle");
  const title = titleInput.value.trim() || "Untitled recipe";

  let totalCal = vegSelected ? VEGETABLE.cal : 0;
  let totalProt = 0;
  const ingredients = [];
  if (vegSelected) ingredients.push({ name: VEGETABLE.name, section: "Vegetables", cal: VEGETABLE.cal, prot: 0 });

  Object.values(selections).forEach(sel => {
    const cal = avg(sel.item.cal) * sel.qty;
    const prot = sel.item.prot ? avg(sel.item.prot) * sel.qty : 0;
    totalCal += cal;
    totalProt += prot;
    ingredients.push({
      name: sel.item.name,
      section: sel.section,
      qtyLabel: QTY_LABELS[sel.qty],
      cal, prot
    });
  });

  const recipe = {
    id: Date.now().toString(36),
    title,
    ingredients,
    totalCal: fmtNum(totalCal),
    totalProt: fmtNum(totalProt),
    createdAt: new Date().toISOString(),
  };

  const saveBtn = document.getElementById("saveBtn");
  saveBtn.disabled = true;
  saveBtn.textContent = "Saving…";
  try {
    await persistRecipe(recipe);
  } catch (err) {
    console.error("Save failed:", err);
    alert("Couldn't save the recipe: " + err.message);
    saveBtn.disabled = false;
    saveBtn.textContent = "Save Recipe";
    return;
  }
  saveBtn.textContent = "Save Recipe";

  clearSelection();
  titleInput.value = "";
  switchTab("saved");
  renderSavedList();
});

document.getElementById("resetBtn").addEventListener("click", clearSelection);

function clearSelection() {
  selections = {};
  vegSelected = false;
  document.querySelectorAll(".ingredient-row input[type=checkbox]").forEach(cb => cb.checked = false);
  document.querySelectorAll(".qty-row").forEach(q => q.classList.remove("show"));
  document.querySelectorAll(".row-stats .cal").forEach(c => c.textContent = "—");
  document.querySelectorAll(".row-stats .prot").forEach(p => p.remove());
  document.querySelectorAll(".ingredient-row.disabled").forEach(r => r.classList.remove("disabled"));
  document.querySelectorAll(".ingredient-row input[disabled]").forEach(cb => cb.disabled = false);
  const vegCb = document.getElementById("vegCheckbox");
  if (vegCb) vegCb.checked = false;
  updateSummary();
}

// ================= TABS =================
function switchTab(tab) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.getElementById("view-build").classList.toggle("active", tab === "build");
  document.getElementById("view-saved").classList.toggle("active", tab === "saved");
}
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    switchTab(btn.dataset.tab);
    if (btn.dataset.tab === "saved") renderSavedList();
  });
});

// ================= SAVED RECIPES VIEW =================
async function renderSavedList(filter) {
  const listEl = document.getElementById("recipeList");
  listEl.innerHTML = '<div class="empty-state">Loading…</div>';

  let all;
  try {
    all = await fetchRecipes();
  } catch (err) {
    console.error("Fetch recipes failed:", err);
    listEl.innerHTML = `<div class="empty-state"><div class="big">Couldn't load recipes</div>${err.message}</div>`;
    return;
  }

  let list = all;
  if (filter && filter.trim()) {
    const f = filter.trim().toLowerCase();
    list = all.filter(r => {
      if (r.title.toLowerCase().includes(f)) return true;
      return r.ingredients.some(ing => ing.name.toLowerCase().includes(f));
    });
  }

  if (list.length === 0) {
    listEl.innerHTML = `<div class="empty-state"><div class="big">${all.length === 0 ? "No recipes yet" : "No matches"}</div>${all.length === 0 ? "Build a recipe and save it — it'll show up here." : "Try a different search term."}</div>`;
    return;
  }

  listEl.innerHTML = "";
  list.forEach(recipe => {
    const card = document.createElement("div");
    card.className = "recipe-card";
    const ingNames = recipe.ingredients.map(i => i.name).join(", ");
    card.innerHTML = `
      <div class="recipe-card-top">
        <div class="recipe-title">${recipe.title}</div>
        <div class="recipe-stats"><span class="mono">${recipe.totalCal}</span> cal · <span class="mono">${recipe.totalProt}g</span> protein</div>
      </div>
      <div class="recipe-ingredients">${ingNames}</div>
    `;
    card.addEventListener("click", () => openModal(recipe));
    listEl.appendChild(card);
  });
}

document.getElementById("searchInput").addEventListener("input", (e) => {
  renderSavedList(e.target.value);
});

// ================= MODAL =================
let openRecipe = null;

function openModal(recipe) {
  openRecipe = recipe;

  document.getElementById("modalTitle").textContent = recipe.title;
  document.getElementById("modalCalories").textContent = recipe.totalCal;
  document.getElementById("modalProtein").textContent = recipe.totalProt + "g";
  document.getElementById("modalIngList").innerHTML = recipe.ingredients.map(ing => `
    <div class="modal-ing-row">
      <span>${ing.name}${ing.qtyLabel && ing.qtyLabel !== "Full" ? " (" + ing.qtyLabel + ")" : ""}</span>
      <span class="mono">${fmtNum(ing.cal)} cal</span>
    </div>
  `).join("");

  document.getElementById("overlay").classList.add("show");
}

document.getElementById("closeModal").addEventListener("click", () => {
  document.getElementById("overlay").classList.remove("show");
});
document.getElementById("overlay").addEventListener("click", (e) => {
  if (e.target.id === "overlay") document.getElementById("overlay").classList.remove("show");
});

document.getElementById("modalDelete").addEventListener("click", async () => {
  if (!openRecipe) return;
  const delBtn = document.getElementById("modalDelete");
  delBtn.disabled = true;
  delBtn.textContent = "Deleting…";
  try {
    await deleteRecipeById(openRecipe.id);
  } catch (err) {
    console.error("Delete failed:", err);
    alert("Couldn't delete the recipe: " + err.message);
    delBtn.disabled = false;
    delBtn.textContent = "Delete Recipe";
    return;
  }
  delBtn.disabled = false;
  delBtn.textContent = "Delete Recipe";
  openRecipe = null;
  document.getElementById("overlay").classList.remove("show");
  renderSavedList(document.getElementById("searchInput").value);
});

// ================= INIT =================
host.addEventListener("click", (e) => {
  const del = e.target.closest(".custom-del");
  if (!del) return;
  const section = del.dataset.section;
  const itemName = del.dataset.item;
  const k = keyFor(section, itemName);
  delete selections[k];
  removeCustomIngredient(section, itemName);
  renderSections();
  updateSummary();
});

renderSections();
updateSummary();
renderSavedList();
</script>
